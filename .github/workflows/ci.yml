name: Windows build and tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: .NET 9 / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore locked dependencies
        run: dotnet restore ./SubTerra/SubTerra.sln --locked-mode

      - name: Build Release
        run: dotnet build ./SubTerra/SubTerra.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./SubTerra.Tests/SubTerra.Tests.csproj --configuration Release --no-build --no-restore
